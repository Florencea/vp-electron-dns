name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "true"
  NO_COLOR: "1"
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

defaults:
  run:
    shell: bash

jobs:
  gatekeeper:
    name: Gatekeeper (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: package.json
          run-install: false
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(vp exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-

      - name: Cache Vite Task Cache
        uses: actions/cache@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ runner.os }}-vite-task-cache-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vite-task-cache-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-vite-task-cache-

      - name: Setup test environment (install browser)
        run: vp run test:setup

      - name: Install Playwright system dependencies on Linux
        run: vp exec playwright install-deps chromium

      - name: Check (Oxlint & Oxfmt)
        run: vp check

      - name: Lint (Tailwind CSS)
        run: vp run agent:lint:tailwind

      - name: Check dead code (Knip)
        run: vp run check:deadcode

      - name: Run unit and component tests
        run: vp run agent:test:unit

      - name: Build production targets
        run: vp run build:all

      - name: Pack unpacked application
        run: vp run --no-cache app:pack
        env:
          DEBUG: "electron-forge:*,electron-packager"

      - name: Run E2E smoke test
        run: xvfb-run --auto-servernum vp run agent:test:e2e

      - name: Try package on Linux
        run: vp run --no-cache app:linux
        env:
          DEBUG: "electron-forge:*,electron-packager"

      - name: Generate Gatekeeper Step Summary
        if: always()
        run: |
          {
            echo "### 🚀 Gatekeeper Summary (Linux)"
            echo "- **Node.js**: $(node -v) (LTS)"
            echo "- **Vite+**: $(vp --version 2>&1 | head -n 1)"
            echo "- **Runner OS**: ${{ runner.os }} (${{ runner.arch }})"
            echo "- **Status**: ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gatekeeper-failure-artifacts
          path: |
            out/
            test-results/
            playwright-report/
            *.log
          if-no-files-found: ignore
          retention-days: 7

  platform-compat:
    name: Platform Compatibility (${{ matrix.os }})
    needs: gatekeeper
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: package.json
          run-install: false
          cache: true

      - name: Install dependencies
        run: vp install

      - name: Cache Vite Task Cache
        uses: actions/cache@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ runner.os }}-vite-task-cache-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vite-task-cache-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-vite-task-cache-

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(vp exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-playwright-

      - name: Setup test environment (install browser)
        run: vp run test:setup

      - name: Run unit and component tests
        run: vp run agent:test:unit

      - name: Build production targets
        run: vp run build:all

      - name: Try package on macOS
        if: runner.os == 'macOS'
        run: vp run --no-cache app:mac
        env:
          DEBUG: "electron-forge:*,electron-packager"

      - name: Try package on Windows
        if: runner.os == 'Windows'
        run: vp run --no-cache app:win
        env:
          DEBUG: "electron-forge:*,electron-packager"

      - name: Generate Platform Compat Step Summary
        if: always()
        run: |
          {
            echo "### 🌐 Platform Compatibility Summary (${{ matrix.os }})"
            echo "- **Node.js**: $(node -v) (LTS)"
            echo "- **Runner OS**: ${{ runner.os }} (${{ runner.arch }})"
            echo "- **Status**: ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: platform-compat-failure-artifacts-${{ matrix.os }}
          path: |
            out/
            test-results/
            playwright-report/
            *.log
          if-no-files-found: ignore
          retention-days: 7
